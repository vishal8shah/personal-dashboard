<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Vish · OS Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07091A;
  --bg-1: #0A0F1E;
  --bg-2: #0F1528;
  --panel: rgba(255,255,255,0.028);
  --panel-hi: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.13);
  --text: #E6EBF5;
  --text-dim: #8A93A8;
  --text-mute: #555D72;
  --accent: #00C2FF;
  --accent-dim: rgba(0,194,255,0.14);
  --gain: #00E676;
  --loss: #FF3D57;
  --warn: #F5A623;
  --neutral: #6B7A99;

  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;

  --radius: 6px;
  --radius-lg: 10px;
}

body.theme-light {
  --bg: #F2F4F8;
  --bg-1: #E9ECF3;
  --bg-2: #FFFFFF;
  --panel: rgba(255,255,255,0.85);
  --panel-hi: rgba(255,255,255,1);
  --border: rgba(10,15,30,0.08);
  --border-hi: rgba(10,15,30,0.16);
  --text: #0A0F1E;
  --text-dim: #49526A;
  --text-mute: #8892A8;
}

body.accent-green { --accent: #00E676; --accent-dim: rgba(0,230,118,0.14); }
body.accent-purple { --accent: #B47CFF; --accent-dim: rgba(180,124,255,0.16); }
body.accent-amber { --accent: #F5A623; --accent-dim: rgba(245,166,35,0.16); }

body.scenario-bull { --accent: #00E676; --accent-dim: rgba(0,230,118,0.14); }
body.scenario-bear { --accent: #FF3D57; --accent-dim: rgba(255,61,87,0.14); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}

.app {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
}

.worldmap {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}
.worldmap svg { width: 100%; height: 100%; }

.main {
  position: relative;
  z-index: 1;
  flex: 1;
}

/* ---------- panel ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  transition: border-color .15s;
}
.panel:hover { border-color: var(--border-hi); }
.panel.collapsed .panel-body { display: none; }
.panel.collapsed { padding-bottom: 0; }

.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.panel.collapsed .panel-head { border-bottom: 0; }
.panel-head .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.panel-title {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.panel-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-mute);
  margin-left: auto;
  display: flex; gap: 10px; align-items: center;
}
.panel-sub .chip {
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 9.5px;
  letter-spacing: 0.08em;
}
.panel-body { padding: 8px 10px 10px; min-height: 0; overflow: auto; }

.panel-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  cursor: pointer;
  line-height: 1;
  height: 20px;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-hi); }

/* ---------- numeric / chrome ---------- */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num-lg { font-family: var(--mono); font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.num-xl { font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
.num-md { font-family: var(--mono); font-weight: 500; font-size: 14px; }
.num-sm { font-family: var(--mono); font-weight: 500; font-size: 11px; }
.lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mute); }
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.warn { color: var(--warn); }
.acc { color: var(--accent); }

/* ---------- top bar ---------- */
.topbar {
  position: relative;
  z-index: 2;
  display: flex; align-items: center; gap: 14px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,15,30,0.6);
  backdrop-filter: blur(12px);
}
body.theme-light .topbar { background: rgba(255,255,255,0.75); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 5px;
  background: linear-gradient(135deg, var(--accent), rgba(0,194,255,0.4));
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 700; font-size: 11px; color: #0A0F1E;
}
.brand-name { font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
.brand-loc { font-family: var(--mono); font-size: 10px; color: var(--text-mute); }

.clock { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
.clock .t { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.clock .d { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

.mkt-status { display: flex; gap: 10px; margin-left: 10px; }
.mkt-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono); font-size: 10px;
}
.mkt-pill .ind {
  width: 5px; height: 5px; border-radius: 50%;
}
.ind-open { background: var(--gain); box-shadow: 0 0 6px var(--gain); }
.ind-closed { background: var(--text-mute); }
.ind-pre { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

.spacer { flex: 1; }

.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
  background: rgba(255,255,255,0.02);
}
.seg button {
  background: transparent;
  border: 0;
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  cursor: pointer;
  letter-spacing: 0.06em;
}
.seg button.on {
  background: var(--accent-dim);
  color: var(--accent);
}
.seg button:hover:not(.on) { color: var(--text); }

.scenario-seg button.on { background: var(--accent-dim); color: var(--accent); }

.top-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-family: var(--mono); font-size: 10px;
  padding: 4px 8px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.top-btn:hover { color: var(--text); border-color: var(--border-hi); }

.swatch { width: 10px; height: 10px; border-radius: 50%; }
.sw-blue { background: #00C2FF; }
.sw-green { background: #00E676; }
.sw-purple { background: #B47CFF; }
.sw-amber { background: #F5A623; }

/* ---------- ticker strip ---------- */
.ticker-strip {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  height: 30px;
  background: rgba(0,0,0,0.2);
}
body.theme-light .ticker-strip { background: rgba(255,255,255,0.5); }
.ticker-item {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-right: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 10.5px;
  height: 100%;
  white-space: nowrap;
}
.ticker-item .sym { color: var(--text-dim); }
.ticker-item .px { color: var(--text); font-weight: 500; }

/* panel tabs */
.ptabs {
  display: flex;
  gap: 2px;
  margin: 0 0 8px;
  border-bottom: 1px solid var(--border);
}
.ptab {
  background: transparent;
  border: 0;
  border-bottom: 1.5px solid transparent;
  padding: 4px 10px 6px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-mute);
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: -1px;
}
.ptab:hover { color: var(--text-dim); }
.ptab.on { color: var(--accent); border-bottom-color: var(--accent); }
.ptab .count { color: var(--text-mute); margin-left: 5px; font-size: 9px; }
.ptab.on .count { color: var(--accent); }

/* ---------- tiles / grids inside panels ---------- */
.tile-grid {
  display: grid;
  gap: 5px;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
}
.tile {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: rgba(255,255,255,0.015);
  position: relative;
  cursor: default;
  transition: transform .12s, border-color .12s, background .12s;
}
.tile:hover {
  border-color: var(--border-hi);
  background: rgba(255,255,255,0.035);
  transform: translateY(-1px);
  z-index: 2;
}
.tile .sym { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.06em; }
.tile .px { font-family: var(--mono); font-weight: 600; font-size: 13.5px; margin-top: 2px; letter-spacing: -0.01em; }
.tile .chg { font-family: var(--mono); font-size: 9.5px; margin-top: 1px; }
.tile .spark { position: absolute; right: 6px; bottom: 6px; opacity: 0.7; }
.tile:hover .spark { opacity: 1; }
.tile .hover-detail {
  position: absolute; inset: 0;
  padding: 8px 10px;
  background: rgba(10,15,30,0.94);
  border-radius: 6px;
  display: none;
  flex-direction: column;
  gap: 2px;
  font-family: var(--mono);
  font-size: 10px;
  backdrop-filter: blur(8px);
}
body.theme-light .tile .hover-detail { background: rgba(255,255,255,0.97); }
.tile:hover .hover-detail { display: flex; }

/* ---------- macro row ---------- */
.macro-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.macro-cell {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.macro-cell .k { font-size: 9.5px; color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase; }
.macro-cell .v { font-family: var(--mono); font-size: 13px; font-weight: 600; margin-top: 2px; }

/* ---------- portfolio rows ---------- */
.portfolio {
  display: grid;
  grid-template-columns: 64px 1fr auto auto 60px;
  gap: 10px;
  align-items: center;
  padding: 6px 4px;
  border-bottom: 1px dashed var(--border);
  font-family: var(--mono);
  font-size: 11px;
}
.portfolio:last-child { border-bottom: 0; }
.portfolio .sym { color: var(--text); font-weight: 500; }
.portfolio .name { color: var(--text-mute); font-size: 10px; font-family: var(--sans); }
.portfolio .val { text-align: right; }
.portfolio .delta { text-align: right; font-size: 10px; }

/* ---------- heatmap ---------- */
.heatmap {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-top: 6px;
}
.heat-cell {
  aspect-ratio: 1.3;
  border-radius: 5px;
  padding: 6px 7px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: default;
  transition: transform .12s;
}
.heat-cell:hover { transform: translateY(-1px); z-index: 2; }
.heat-cell .hsub { font-family: var(--mono); font-size: 9.5px; color: rgba(255,255,255,0.72); }
.heat-cell .hmed { font-family: var(--mono); font-weight: 600; font-size: 11.5px; color: #fff; }
.heat-cell .hchg { font-family: var(--mono); font-size: 9.5px; color: rgba(255,255,255,0.85); }

/* ---------- progress / gauges ---------- */
.bar {
  height: 6px;
  background: rgba(255,255,255,0.04);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.bar > .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), rgba(0,194,255,0.5));
  border-radius: 3px;
}
.bar.bar-gain > .fill { background: linear-gradient(90deg, var(--gain), rgba(0,230,118,0.4)); }
.bar.bar-warn > .fill { background: linear-gradient(90deg, var(--warn), rgba(245,166,35,0.4)); }
.bar.bar-loss > .fill { background: linear-gradient(90deg, var(--loss), rgba(255,61,87,0.4)); }

/* ---------- sprint cards ---------- */
.kanban {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.kan-col {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  background: rgba(255,255,255,0.015);
}
.kan-col h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.kan-col h4 span { font-family: var(--mono); font-size: 10px; color: var(--text-mute); }
.ticket {
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 5px;
  font-size: 11px;
  cursor: grab;
  background: rgba(255,255,255,0.02);
  transition: border-color .12s, transform .12s;
}
.ticket:active { cursor: grabbing; }
.ticket:hover { border-color: var(--border-hi); transform: translateY(-1px); }
.ticket .id { font-family: var(--mono); font-size: 9.5px; color: var(--text-mute); }
.ticket .t { margin-top: 2px; color: var(--text); font-size: 10.5px; }
.ticket .meta { display: flex; gap: 6px; margin-top: 5px; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  letter-spacing: 0.05em;
}
.badge.b-gain { color: var(--gain); border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.06); }
.badge.b-loss { color: var(--loss); border-color: rgba(255,61,87,0.3); background: rgba(255,61,87,0.06); }
.badge.b-warn { color: var(--warn); border-color: rgba(245,166,35,0.3); background: rgba(245,166,35,0.06); }
.badge.b-acc { color: var(--accent); border-color: rgba(0,194,255,0.3); background: rgba(0,194,255,0.06); }
.badge.b-p0 { color: var(--loss); border-color: rgba(255,61,87,0.35); }
.badge.b-p1 { color: var(--warn); border-color: rgba(245,166,35,0.3); }
.badge.b-p2 { color: var(--text-dim); }

/* ---------- feed cards ---------- */
.feed-card {
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 8px;
  margin-bottom: 4px;
  background: rgba(255,255,255,0.015);
  cursor: pointer;
  transition: border-color .12s;
}
.feed-card:hover { border-color: var(--border-hi); }
.feed-card .src { font-family: var(--mono); font-size: 9.5px; color: var(--text-mute); letter-spacing: 0.05em; }
.feed-card .t { font-size: 11.5px; color: var(--text); margin-top: 2px; line-height: 1.3; }
.feed-card .tm { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); }

/* ---------- check list ---------- */
.focus-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0;
  border-bottom: 1px dashed var(--border);
  cursor: pointer;
  user-select: none;
}
.focus-item:last-child { border-bottom: 0; }
.focus-item .cb {
  width: 14px; height: 14px; border: 1px solid var(--border-hi);
  border-radius: 3px;
  display: grid; place-items: center;
  flex-shrink: 0;
  transition: all .15s;
}
.focus-item.done .cb {
  background: var(--accent);
  border-color: var(--accent);
}
.focus-item.done .cb::after {
  content: '✓'; font-size: 10px; color: #0A0F1E; font-weight: 700;
}
.focus-item.done .t { color: var(--text-mute); text-decoration: line-through; }
.focus-item .t { flex: 1; font-size: 12px; }
.focus-item .tag { font-family: var(--mono); font-size: 9px; color: var(--text-mute); padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; letter-spacing: 0.05em; }

/* ---------- gauge ---------- */
.gauge-wrap { display: flex; align-items: center; gap: 10px; }
.gauge { width: 64px; height: 64px; position: relative; flex-shrink: 0; }
.gauge svg { transform: rotate(-90deg); }
.gauge .gv {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 13px;
}

/* ---------- tooltip ---------- */
[data-tooltip] { position: relative; }

/* ---------- tweaks panel ---------- */
.tweaks {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 20;
  width: 280px;
  background: rgba(10,15,30,0.94);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  padding: 12px;
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 60px rgba(0,0,0,0.6);
  font-family: var(--sans);
  transform: translateY(calc(100% + 20px));
  opacity: 0;
  transition: transform .2s, opacity .2s;
  pointer-events: none;
}
body.theme-light .tweaks { background: rgba(255,255,255,0.98); }
.tweaks.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.tweaks h3 {
  margin: 0 0 10px;
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); font-weight: 600;
  display: flex; justify-content: space-between; align-items: center;
}
.tweaks .row { margin-bottom: 10px; }
.tweaks .k { font-size: 10px; color: var(--text-mute); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; }
.tweaks .swatches { display: flex; gap: 6px; }
.tweaks .swatches .s {
  width: 22px; height: 22px; border-radius: 5px; cursor: pointer;
  border: 2px solid transparent;
}
.tweaks .swatches .s.on { border-color: var(--text); }
.tweaks .seg { width: 100%; }
.tweaks .seg button { flex: 1; text-align: center; }
.tweaks .slider { width: 100%; }
.tweaks .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text); }
.tweaks .switch {
  width: 30px; height: 16px; border-radius: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--border);
  position: relative; cursor: pointer; transition: background .15s;
}
.tweaks .switch.on { background: var(--accent-dim); border-color: var(--accent); }
.tweaks .switch::after {
  content: ''; position: absolute;
  top: 1px; left: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-dim);
  transition: transform .15s, background .15s;
}
.tweaks .switch.on::after { transform: translateX(14px); background: var(--accent); }

/* ---------- compound chart ---------- */
.chart-box {
  width: 100%;
  aspect-ratio: 2.6;
  border: 1px solid var(--border);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.01);
}

/* Utility */
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 4px; }

.stress-banner {
  margin: 0 0 8px;
  padding: 6px 10px;
  border: 1px solid rgba(255,61,87,0.4);
  background: rgba(255,61,87,0.1);
  color: var(--loss);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: none;
}
body.scenario-bear .stress-banner { display: block; }

/* scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

/* Sparkline animations */
@keyframes dash-grow { from { stroke-dasharray: 0 400; } to { stroke-dasharray: 400 0; } }
.tile:hover .spark path.line { animation: dash-grow 0.8s ease-out; }

@keyframes pulse-ind { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.ind-open { animation: pulse-ind 2.2s ease-in-out infinite; }

/* ---------- MASONRY LAYOUTS ----------
   Uses CSS multicol for natural packing — no row gaps.
   Panels flow top-down, filling each column; break-inside prevents splits. */

.main > * { break-inside: avoid; page-break-inside: avoid; margin-bottom: 8px; }
.main { padding: 8px; }

.layout-trading .main,
.layout-builder .main,
.layout-research .main {
  column-gap: 8px;
}

/* Trading: 3 columns — left=markets+portfolio, middle=ai+property, right=feed+wealth+servicenow */
.layout-trading .main { columns: 3; }
.layout-trading .g-market     { order: 1; }
.layout-trading .g-portfolio  { order: 2; }
.layout-trading .g-ai         { order: 3; }
.layout-trading .g-property   { order: 4; }
.layout-trading .g-feed       { order: 5; }
.layout-trading .g-widgets    { order: 6; }
.layout-trading .g-wealth     { order: 7; }
.layout-trading .g-servicenow { order: 8; }

/* Builder: 2 columns, markets hidden, AI + ServiceNow dominate, ticker tape spans */
.layout-builder .main { columns: 2; }
.layout-builder .g-market     { display: none; }
.layout-builder .g-portfolio  { display: none; }
.layout-builder .g-ticker-tape { column-span: all; margin-bottom: 10px; }
.layout-builder .g-ai         { order: 1; }
.layout-builder .g-property   { order: 2; }
.layout-builder .g-servicenow { order: 3; }
.layout-builder .g-feed       { order: 4; }
.layout-builder .g-widgets    { order: 5; }
.layout-builder .g-wealth     { order: 6; }

/* Research: 2 columns — property/wealth big, others flank */
.layout-research .main { columns: 2; }
.layout-research .g-property  { order: 1; }
.layout-research .g-wealth    { order: 2; }
.layout-research .g-market    { order: 3; }
.layout-research .g-portfolio { order: 4; }
.layout-research .g-feed      { order: 5; }
.layout-research .g-widgets   { order: 6; }
.layout-research .g-ai        { order: 7; }
.layout-research .g-servicenow{ order: 8; }

@media (max-width: 1100px) {
  .layout-trading .main { columns: 2; }
}
@media (max-width: 780px) {
  .layout-trading .main, .layout-builder .main, .layout-research .main { columns: 1; }
}

/* hide servicenow flag */
body.hide-servicenow .g-servicenow { display: none; }

/* Density */
body.density-relaxed { font-size: 14px; }
body.density-relaxed .num-lg { font-size: 20px; }
body.density-relaxed .num-xl { font-size: 24px; }
body.density-relaxed .tile { padding: 10px 12px; }
